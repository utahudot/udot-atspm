name: Validate documentation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPOSITORY: ${{ vars.SOURCE_REPOSITORY || 'utahudot/udot-atspm' }}
      SOURCE_REF: ${{ vars.SOURCE_REF || 'main' }}

    steps:
      - name: Check out documentation project
        uses: actions/checkout@v6

      - name: Check out ATSPM source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          path: _source

      - name: Resolve source commit
        id: source
        shell: bash
        run: echo "sha=$(git -C _source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install site dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Test generator
        run: dotnet test GenerateDocuments.sln --configuration Release

      - name: Generate documentation
        run: >-
          dotnet run
          --project src/GenerateDocuments
          --configuration Release
          --no-build
          --
          --source-root "${{ github.workspace }}/_source"
          --output-root "${{ github.workspace }}/site/docs/configuration"
          --map "${{ github.workspace }}/config/container-config-map.json"
          --repository-url "https://github.com/${{ env.SOURCE_REPOSITORY }}"
          --repository-ref "${{ steps.source.outputs.sha }}"

      - name: Build site
        run: python -m mkdocs build --strict
