name: Publish documentation pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-pages.yml"
      - "config/**"
      - "docs/**"
      - "site/**"
      - "src/**"
      - "tests/**"
      - "GenerateDocuments.sln"
      - "mkdocs.yml"
      - "requirements.txt"
  repository_dispatch:
    types:
      - atspm-docs-update
  workflow_dispatch:
    inputs:
      source_repository:
        description: Source repository in owner/repository format
        required: false
        default: ""
        type: string
      source_ref:
        description: Source branch, tag, or commit SHA
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository || inputs.source_repository || vars.SOURCE_REPOSITORY || 'utahudot/udot-atspm' }}
      SOURCE_REF: ${{ github.event.client_payload.source_sha || inputs.source_ref || vars.SOURCE_REF || 'main' }}
      DOCS_DIR: docs/autogenerated

    steps:
      - name: Check out documentation project
        uses: actions/checkout@v6

      - name: Check out ATSPM source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          path: _source

      - name: Resolve source commit
        id: source
        shell: bash
        run: echo "sha=$(git -C _source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install site dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Test generator
        run: dotnet test GenerateDocuments.sln --configuration Release

      - name: Generate documentation
        run: >-
          dotnet run
          --project src/GenerateDocuments
          --configuration Release
          --no-build
          --
          --source-root "${{ github.workspace }}/_source"
          --output-root "${{ github.workspace }}/docs/autogenerated"
          --map "${{ github.workspace }}/config/container-config-map.json"
          --repository-url "https://github.com/${{ env.SOURCE_REPOSITORY }}"
          --repository-ref "${{ steps.source.outputs.sha }}"

      - name: Build site
        run: python -m mkdocs build --strict

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/build

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
