site_name: ATSPM Documentation
site_description: Generated configuration reference for the ATSPM platform
site_url: ""
repo_url: https://github.com/utahudot/udot-atspm
repo_name: utahudot/udot-atspm
# The default is correct while this project is nested in the ATSPM repository.
# Standalone workflows override DOCS_DIR after this project is transferred.
docs_dir: !ENV [DOCS_DIR, ../docs/autogenerated]
site_dir: site/build
strict: true

theme:
  name: mkdocs
  nav_style: dark

plugins:
  - search

markdown_extensions:
  - tables
  - toc:
      permalink: true

copyright: Copyright Utah Department of Transportation
