name: Update external documentation

on:
  push:
    branches:
      - main
    paths:
      - "Atspm/Infrastructure/Configuration/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      DOCS_REPOSITORY: ${{ vars.DOCS_REPOSITORY }}
      GH_TOKEN: ${{ secrets.DOCS_REPO_DISPATCH_TOKEN }}

    steps:
      - name: Validate dispatch configuration
        shell: bash
        run: |
          if [[ -z "$DOCS_REPOSITORY" ]]; then
            echo "DOCS_REPOSITORY must be set to owner/repository." >&2
            exit 1
          fi
          if [[ -z "$GH_TOKEN" ]]; then
            echo "DOCS_REPO_DISPATCH_TOKEN is not configured." >&2
            exit 1
          fi

      - name: Dispatch documentation update
        shell: bash
        run: |
          gh api \
            --method POST \
            "repos/${DOCS_REPOSITORY}/dispatches" \
            --field event_type=atspm-docs-update \
            --field "client_payload[source_repository]=${GITHUB_REPOSITORY}" \
            --field "client_payload[source_sha]=${GITHUB_SHA}"
