name: Update autogenerated documentation

on:
  push:
    branches:
      - main
    paths:
      - "Atspm/Infrastructure/Configuration/**"
      - "Atspm/Infrastructure/LogMessages/**"
      - "Atspm/Data/Enums/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autogenerated-documentation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out ATSPM
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate documentation
        uses: avenueconsultants/atspm-documentation-generator@REPLACE_WITH_COMMIT_SHA
        with:
          source-root: .
          output-root: docs/autogenerated
          repository-url: https://github.com/${{ github.repository }}
          repository-ref: ${{ github.sha }}

      - name: Detect documentation changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- docs/autogenerated; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated documentation
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          UPDATE_BRANCH: automation/update-autogenerated-docs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$UPDATE_BRANCH"
          git add -- docs/autogenerated/*.md
          git commit -m "Update autogenerated documentation for ${GITHUB_SHA::12}"
          git push --force origin "HEAD:$UPDATE_BRANCH"

      - name: Open or update documentation pull request
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/update-autogenerated-docs
        run: |
          set -euo pipefail
          if gh pr view "$UPDATE_BRANCH" --json number --jq .number >/dev/null 2>&1; then
            gh pr edit "$UPDATE_BRANCH" \
              --title "Update autogenerated documentation" \
              --body "Regenerated from ATSPM commit \`${GITHUB_SHA}\`."
          else
            gh pr create \
              --base main \
              --head "$UPDATE_BRANCH" \
              --title "Update autogenerated documentation" \
              --body "Regenerated from ATSPM commit \`${GITHUB_SHA}\`."
          fi
