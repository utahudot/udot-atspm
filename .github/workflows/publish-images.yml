name: Build Gilbert Containers and Publish to GHCR
run-name: Publish Gilbert images from ${{ github.ref_name }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_versions:
        description: 'JSON object mapping each Gilbert package name to its next numbered tag (for example, {"gilbertwebsite":"v16"})'
        required: true
        type: string
      publish:
        description: Push to GHCR (disable to download Docker image archives without package access)
        required: false
        default: true
        type: boolean
      update_latest:
        description: Also tag these images as latest
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gilbertwebsite
            project: WebUI
          - image: gilbertconfig
            project: ConfigApi
          - image: gilbertconfigapi
            project: ConfigApi
          - image: gilbertdata
            project: DataApi
          - image: gilbertidentity
            project: IdentityApi
          - image: gilbertreport
            project: ReportApi
          - image: gilbertwatchdog
            project: WatchDog
          - image: gilberteventlog
            project: EventLogUtility
          - image: gilbertdatabaseinstaller
            project: DatabaseInstaller

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_VERSIONS: ${{ inputs.image_versions }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            IMAGE_TAG=$(jq -er --arg image "$IMAGE_NAME" '.[$image]' <<< "$IMAGE_VERSIONS")
            if [[ ! "$IMAGE_TAG" =~ ^v[0-9]+$ ]]; then
              echo "::error::Expected a numbered tag such as v16 for $IMAGE_NAME"
              exit 1
            fi
          else
            IMAGE_TAG="$GITHUB_REF_NAME"
          fi

          IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          IMAGE_TAGS="${IMAGE_REPO}:${IMAGE_TAG}"
          if { [ "$GITHUB_EVENT_NAME" = "release" ] && [ "$IS_PRERELEASE" != "true" ]; } || [ "$UPDATE_LATEST" = "true" ]; then
            IMAGE_TAGS="${IMAGE_TAGS},${IMAGE_REPO}:latest"
          fi
          echo "image_tags=$IMAGE_TAGS" >> "$GITHUB_OUTPUT"
          echo "image_version=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        id: builder
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event_name == 'release' || inputs.publish }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.builder.outputs.name }}
          context: ${{ matrix.project == 'WebUI' && 'Atspm/WebUI' || 'Atspm' }}
          file: Atspm/${{ matrix.project }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'release' || inputs.publish }}
          outputs: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish && format('type=docker,dest={0}/{1}.tar', runner.temp, matrix.image) || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          tags: ${{ steps.meta.outputs.image_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.image_version }}

      - name: Verify image archive
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        working-directory: ${{ runner.temp }}
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_TAGS: ${{ steps.meta.outputs.image_tags }}
        run: |
          tar -xOf "$IMAGE_NAME.tar" manifest.json > "$IMAGE_NAME-manifest.json"
          IFS=',' read -ra TAGS <<< "$IMAGE_TAGS"
          for tag in "${TAGS[@]}"; do
            jq -e --arg tag "$tag" 'any(.[].RepoTags[]; . == $tag)' "$IMAGE_NAME-manifest.json"
          done
          IMAGE_CONFIG=$(jq -er '.[0].Config' "$IMAGE_NAME-manifest.json")
          tar -xOf "$IMAGE_NAME.tar" "$IMAGE_CONFIG" | jq -e --arg sha "$GITHUB_SHA" '.os == "linux" and .architecture == "amd64" and .config.Labels["org.opencontainers.image.revision"] == $sha'
          sha256sum "$IMAGE_NAME.tar" > "$IMAGE_NAME.sha256"

      - name: Upload image archive
        id: archive
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image }}-${{ steps.meta.outputs.image_version }}
          path: |
            ${{ runner.temp }}/${{ matrix.image }}.tar
            ${{ runner.temp }}/${{ matrix.image }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Record image result
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.image_tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_ARCHIVE_URL: ${{ steps.archive.outputs.artifact-url }}
        run: |
          printf 'Image: `%s`\n\nDigest: `%s`\n\nCommit: `%s`\n\nArchive: %s\n' "$IMAGE_TAGS" "$IMAGE_DIGEST" "$GITHUB_SHA" "$IMAGE_ARCHIVE_URL" >> "$GITHUB_STEP_SUMMARY"
