name: Build Containers

on:
  push:
    branches:
      - Staging

permissions:
  id-token: write
  contents: read

jobs:
  changes:
    name: Find Containers to build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4     
      # Check which Containers have changed files
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: .github/filters.json
    outputs:
      changes: ${{steps.changes.outputs.changes}}

  build:
    name: Build Job
    needs: changes
    if: ${{ needs.changes.outputs.changes != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: ${{fromJson(needs.changes.outputs.changes)}}

    steps:
      - name: ⬇️ Set up code
        uses: actions/checkout@v4

      - name: 📁 Get Working Dir
        run: |
          case "${{ matrix.name }}" in
            atspm-webui) docker_dir="Atspm/WebUI/" ;;
            atspm-config-api) docker_dir="Atspm/ConfigApi/" ;;
            atspm-data-api) docker_dir="Atspm/DataApi/" ;;
            atspm-identity-api) docker_dir="Atspm/IdentityApi/" ;;
            atspm-report-api) docker_dir="Atspm/ReportApi/" ;;
            atspm-watchdog) docker_dir="Atspm/WatchDog/" ;;
            atspm-eventlogutil) docker_dir="Atspm/EventLogUtility/" ;;
            *) echo "Unknown container target: ${{ matrix.name }}"; exit 1 ;;
          esac
          echo DOCKERFILE_DIR=${docker_dir} >> $GITHUB_ENV

      - name: 🗝️ Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          create_credentials_file: true
          token_format: access_token
          workload_identity_provider: ${{ secrets.IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      - name: 🐳 Set up Docker Buildx
        id: builder
        uses: docker/setup-buildx-action@v3

      - name: 🗝️ Authenticate Docker to Google Cloud
        uses: docker/login-action@v3
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: 🏷️ Extract tags from GitHub
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.GCP_ARTIFACT_REPO }}/${{ matrix.name }}
          tags: |
            type=ref,suffix=-{{sha}},event=branch
            type=ref,prefix=pr-,suffix=-{{sha}},event=pr
            type=semver,pattern={{version}}
            type=sha
            latest

      - name: 📦 Build and push image
        uses: docker/build-push-action@v6
        if: ${{ matrix.name != 'atspm-webui'}}
        with:
          builder: ${{ steps.builder.outputs.name }}
          tags: ${{ steps.meta.outputs.tags }}
          context: Atspm/
          file: ${{ env.DOCKERFILE_DIR }}/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📦 Build and push image WebUI
        uses: docker/build-push-action@v6
        if: ${{ matrix.name == 'atspm-webui'}}
        with:
          builder: ${{ steps.builder.outputs.name }}
          tags: ${{ steps.meta.outputs.tags }}
          context: ${{ env.DOCKERFILE_DIR }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🚀 Set Service Name from JSON
        id: service_and_region
        run: |
          service_name=$(jq -r --arg matrix_name "${{ matrix.name }}" '.[$matrix_name]' .github/service-names.json)
          echo "SERVICE_NAME=$service_name" >> $GITHUB_ENV

      - name: 🚀 Deploy to Cloud Run
        if: ${{ success() && matrix.name != 'atspm-watchdog' }}
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          if [ -z "$SERVICE_NAME" ] || [ "$SERVICE_NAME" = "null" ]; then
            echo "No Cloud Run service configured for ${{ matrix.name }}; skipping deploy."
            exit 0
          fi
          echo "Deploying $IMAGE to Cloud Run service $SERVICE_NAME"
          gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE" \
            --region "${{ secrets.GCP_REGION }}" \
            --platform managed
        env:
          SERVICE_NAME: ${{ env.SERVICE_NAME }}

      - name: 🚀 Deploy Watchdog Cloud Run Job
        if: ${{ success() && matrix.name == 'atspm-watchdog' }}
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "Deploying $IMAGE to Cloud Run job $SERVICE_NAME"
          if ! gcloud run jobs describe "$SERVICE_NAME" --region "${{ secrets.GCP_REGION }}" >/dev/null 2>&1; then
            echo "::error::Cloud Run job $SERVICE_NAME does not exist in region ${{ secrets.GCP_REGION }}"
            exit 1
          fi
          gcloud run jobs update "$SERVICE_NAME" \
            --image "$IMAGE" \
            --args "generate" \
            --update-secrets "/app/Configuration/secrets.json=watchdogSecrets:latest,/app/Configuration/Connection/connectionStrings.json=New-Connection-String:latest" \
            --update-env-vars "TZ=America/Denver,WatchdogConfiguration__TimeZoneId=America/Denver" \
            --task-timeout "7200s" \
            --region "${{ secrets.GCP_REGION }}"
        env:
          SERVICE_NAME: ${{ env.SERVICE_NAME }}
