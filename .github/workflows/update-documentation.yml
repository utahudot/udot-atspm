name: Update generated documentation

on:
  workflow_dispatch:
  push:
    branches: [Code-Documentations]
    paths-ignore:
      - 'docs/autogenerated/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  documentation:
    # Change @main to @<full-commit-sha> to pin a generator version.
    uses: avenueconsultants/avenue-atspm-documentation-generator/.github/workflows/documentation-pr.yml@main
    with:
      source-branch: Code-Documentations
      target-branch: Code-Documentations
      create-pr: true
      # Defaults: root documentation.json and docs/autogenerated.
      # For an explicit map, optionally assign new sections to ONE chosen page:
      # sync-container: configuration
