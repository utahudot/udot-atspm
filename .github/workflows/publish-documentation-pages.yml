name: Publish reviewed documentation site

on:
  workflow_dispatch:
  push:
    branches: [Code-Documentations]
    paths:
      - 'docs/autogenerated/**'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    # Change @main to @<full-commit-sha> to pin a generator version.
    uses: avenueconsultants/avenue-atspm-documentation-generator/.github/workflows/documentation-pages.yml@main
    with:
      docs-branch: Code-Documentations
      # Runs only for committed, reviewed generated files on this branch.
      publish: true
      # Defaults: root documentation.json and docs/autogenerated.
