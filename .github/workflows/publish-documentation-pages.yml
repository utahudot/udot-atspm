name: Publish reviewed documentation site

on:
  workflow_dispatch:
  push:
    branches: [Code-Documentations-FromMain]
    paths:
      - 'docs/autogenerated/**'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    # Change @main to @<full-commit-sha> to pin a generator version.
    uses: avenueconsultants/avenue-atspm-documentation-generator/.github/workflows/documentation-pages.yml@main
    with:
      docs-branch: Code-Documentations-FromMain
      # Build a preview from committed files; restricted hosting is not configured.
      publish: false
      # Defaults: root documentation.json and docs/autogenerated.
